# review-bot-template: jimwclement/builder-ops .github/scripts/review-bot/code-audit.yml
#
# Full-repository audit ("run codex on the whole repo"), SHARED TEMPLATE copy.
# Do not edit this file in the repo it was installed into: edit it in
# jimwclement/builder-ops (.github/scripts/review-bot/) and re-run
# `scripts/add-review-bot.sh <owner/repo>` there. The daily "Review bot
# coverage" run in builder-ops opens that update for you when a copy
# drifts.
#
# Start it from a builder-ops checkout; it never runs on its own:
#   scripts/run-audit.sh <owner/repo>                    # up to 8 parts
#   scripts/run-audit.sh <owner/repo> --max-chunks 16    # a bigger repo
# run-audit.sh starts this workflow, follows exactly that run, and opens the
# pull request with the caller's gh login. Started by hand instead
# (gh workflow run code-audit.yml -R <owner/repo> [-f max_chunks=16]), the run
# ends with the `gh pr create` command to paste, in a notice and the summary.
#
# What it does:
#   1. checks out the DEFAULT branch at the dispatched commit, without
#      persisted credentials;
#   2. runs .github/scripts/review.mjs in audit mode (REVIEW_MODE=audit): the
#      whole tree at that commit, grouped (runtime-risk, other code, content
#      and data, prose) and packed into parts of about 250,000 characters, one
#      OpenAI call per part (gpt-6.1-sol: medium reasoning for tier 3 parts,
#      low for the rest), in that order, at most max_chunks parts from
#      start_part on. Lockfiles, images, generated files and the bots' own
#      reports are left out, and so are the parts outside this run: every file
#      not audited is named in the report under "## Not audited" with the
#      reason. Nothing is truncated;
#   3. keeps the ONE combined report as the artifact "code-audit";
#   4. commits it as docs/reviews/audit-YYYY-MM-DD.md on a NEW branch,
#      codex-audit/YYYY-MM-DD-<run id>, and pushes that branch. Never the
#      default branch. Nothing merges anything.
# Red when: the run is not on the default branch, max_chunks is not 1 to 24
# or start_part not 1 to 999, OPENAI_API_KEY is not set, no part produced a
# report, or a part's call failed (after the report is delivered; that part's
# files are listed as not audited).
#
# Why the job does not open the pull request itself: GitHub runs no workflows
# for a pull request its own job token opens, so such a PR would show no
# checks (and could not meet required ones) until a person pushed to it; and
# the token may open one only where "Allow GitHub Actions to create and
# approve pull requests" is on, which is off by default (it was off on every
# repo the template was first installed on, 13 Oct 2026). A PR opened with a
# person's login gets CI and the PR review (which skips report files) like any
# other, so that is the one path. The
# audit commit carries NO skip-CI marker, so those runs are not skipped, and a
# squash merge carries no marker into the default branch.
#
# Trust: as in code-review.yml, the only code that runs is review.mjs and the
# classifier from the default branch, the files the PR review already trusts;
# the repository is read by git as data, and the house rules only as a
# regular file. OPENAI_API_KEY reaches the key check and the audit step only.
# The job token pushes one new branch: contents write, nothing else.
#
# Cost: about US$0.25 a part (gpt-6.1-sol, 9 Oct 2026 prices), so about US$2
# at the default cap of 8; the report's Meta line has the exact figure. One
# job, typically 5 to 15 billed minutes (three calls at a time).
name: Code audit
# The request id, when given, is in the run's name, so scripts/run-audit.sh
# can find the exact run it started (gh workflow run does not return one).
run-name: Code audit${{ inputs.request_id != '' && format(' ({0})', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      max_chunks:
        description: "Most model calls (parts), 1 to 24, about US$0.25 each. Files past the cap are listed in the report, not audited."
        required: false
        default: "8"
      start_part:
        description: "First part to audit, for a repo with more parts than one run allows (the report of the previous run says where to start)."
        required: false
        default: "1"
      request_id:
        description: "Optional label for this run's name (scripts/run-audit.sh sets one to find its run)."
        required: false
        default: ""

concurrency:
  group: code-audit
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    # Up to 24 calls, three at a time, each aborted after 6 minutes by
    # review.mjs: 48 minutes at the very worst.
    timeout-minutes: 60
    permissions:
      contents: write # the new codex-audit/ branch, nothing else
    steps:
      - name: Check the run (default branch, inputs, key)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_CHUNKS: ${{ inputs.max_chunks }}
          START_PART: ${{ inputs.start_part }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error title=Run the audit on the default branch::This run was started on ${REF_NAME}. The audit reviews ${DEFAULT_BRANCH}: gh workflow run code-audit.yml -R ${GITHUB_REPOSITORY}"
            exit 1
          fi
          if [[ ! "$MAX_CHUNKS" =~ ^[1-9][0-9]?$ ]] || (( MAX_CHUNKS > 24 )); then
            echo "::error title=max_chunks must be 1 to 24::Got '${MAX_CHUNKS}'."
            exit 1
          fi
          if [[ ! "$START_PART" =~ ^[1-9][0-9]{0,2}$ ]]; then
            echo "::error title=start_part must be 1 to 999::Got '${START_PART}'."
            exit 1
          fi
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::error title=OPENAI_API_KEY is not set on this repo::No audit ran. The daily Review bot coverage run in jimwclement/builder-ops sets it; by hand, from a builder-ops checkout with the key on the clipboard: scripts/set-review-key.sh ${GITHUB_REPOSITORY}"
            exit 1
          fi
          echo "Auditing ${DEFAULT_BRANCH} at ${GITHUB_SHA}: at most ${MAX_CHUNKS} parts, from part ${START_PART}."

      - name: Checkout the default branch at the dispatched commit (no persisted creds)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          # The audit diffs the empty tree against this one commit.
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Audit the whole tree (parts, capped, one report)
        id: audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OpenAI only: review.mjs refuses any Gemini route when this is set.
          REVIEW_NO_GOOGLE: "1"
          REVIEW_MODE: audit
          REVIEW_PROVIDER: openai
          REVIEW_MODEL: gpt-6.1-sol
          DIFF_HEAD: ${{ github.sha }}
          MAX_AUDIT_CHUNKS: ${{ inputs.max_chunks }}
          AUDIT_FIRST_PART: ${{ inputs.start_part }}
          TIER_NOTE: "Tier 3 means it touches server code (route handlers, server actions, middleware, lib/, scripts/), production config, dependencies, public input or the CI workflows themselves."
          OUTPUT_FILE: ${{ runner.temp }}/code-audit.md
        run: |
          for f in .github/scripts/review.mjs .github/scripts/classify-change.mjs; do
            if [[ ! -f "$f" || -L "$f" ]]; then
              echo "::error::${f} is missing on the default branch, or is not a regular file. Re-run scripts/add-review-bot.sh ${GITHUB_REPOSITORY} from jimwclement/builder-ops."
              exit 1
            fi
          done
          # House rules: AGENTS.md, else CLAUDE.md, as a regular file only (a
          # symlink could point the prompt at the runner's environment).
          RULES_FILE="${RUNNER_TEMP}/no-house-rules.md"
          for f in AGENTS.md CLAUDE.md; do
            if [[ -f "$f" && ! -L "$f" ]]; then RULES_FILE="$f"; break; fi
          done
          export RULES_FILE
          set +e
          node .github/scripts/review.mjs
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          # 0: the report. 2: the report, but a part's call failed; the last
          # step turns the run red after the report is delivered. Else none.
          [[ "$rc" == 0 || "$rc" == 2 ]] || exit "$rc"

      - name: Keep the report as an artifact
        if: steps.audit.outputs.rc == '0' || steps.audit.outputs.rc == '2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-audit
          path: ${{ runner.temp }}/code-audit.md
          if-no-files-found: error

      - name: Commit the report on a new branch
        if: steps.audit.outputs.rc == '0' || steps.audit.outputs.rc == '2'
        id: deliver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUDITED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REPORT="${RUNNER_TEMP}/code-audit.md"
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="codex-audit/${DATE}-${GITHUB_RUN_ID}"
          if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
            echo "::error::Refusing to commit to the default branch."; exit 1
          fi
          for d in docs docs/reviews; do
            if [[ -L "$d" ]]; then
              echo "::error::${d} is a symlink on the default branch. Not writing through it; the report is in the artifact."; exit 1
            fi
          done
          FILE="docs/reviews/audit-${DATE}.md"
          n=2
          while [[ -e "$FILE" || -L "$FILE" ]]; do FILE="docs/reviews/audit-${DATE}-${n}.md"; n=$((n + 1)); done
          mkdir -p docs/reviews
          cp "$REPORT" "$FILE"
          # What only the workflow knows, so it cannot be hallucinated.
          echo "sha: ${AUDITED_SHA} | run: ${GITHUB_RUN_ID} | at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$FILE"

          VERDICT=$(awk '/^## Verdict[[:space:]]*$/ {f=1; next} f && NF {sub(/[[:space:]]+$/, ""); print; exit}' "$FILE")
          case "$VERDICT" in
            "All clear"|"Needs fixes"|"Urgent") ;;
            *) echo "::error::The report has no valid verdict line; it is in the artifact."; exit 1 ;;
          esac
          META=$(awk '/^## Meta[[:space:]]*$/ {getline; print; exit}' "$FILE")
          {
            echo "verdict=${VERDICT}"
            echo "branch=${BRANCH}"
            echo "file=${FILE}"
          } >> "$GITHUB_OUTPUT"

          git checkout --quiet -b "$BRANCH"
          git add -- "$FILE"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Codex full audit ${DATE}"
          # The job token reaches git through the environment, never
          # .git/config. A new branch: the push cannot overwrite anything.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push --quiet origin "HEAD:refs/heads/${BRANCH}"
          echo "Committed ${FILE} to ${BRANCH}."

          # The pull request is opened with a person's login (see the header):
          # scripts/run-audit.sh does it, or this command does.
          CMD="gh pr create -R ${GITHUB_REPOSITORY} --base ${DEFAULT_BRANCH} --head ${BRANCH} --title \"Codex full audit ${DATE}\" --body \"Full-repository audit (${VERDICT}). Report: ${FILE}. Run: ${RUN_URL}\""
          echo "::notice title=Codex full audit: ${VERDICT}::Report ${FILE} on ${BRANCH}, and the artifact code-audit. scripts/run-audit.sh opens the pull request; started by hand, open it with: ${CMD}"
          {
            echo "### Codex full audit: ${VERDICT}"
            echo "- Report: \`${FILE}\` on \`${BRANCH}\`, and the artifact **code-audit**"
            echo "- Meta: \`${META}\`"
            echo "- Pull request: scripts/run-audit.sh opens it. Started by hand: \`${CMD}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag an Urgent verdict
        if: steps.deliver.outputs.verdict == 'Urgent'
        env:
          FILE: ${{ steps.deliver.outputs.file }}
          BRANCH: ${{ steps.deliver.outputs.branch }}
        run: echo "::warning title=Audit verdict - Urgent::Read the Critical Issues in ${FILE} on ${BRANCH}."

      - name: Fail when part of the repository could not be audited
        # After the report is delivered, so the paid-for parts are not lost.
        if: steps.audit.outputs.rc == '2'
        run: |
          echo "::error title=Part of the audit failed::At least one part's model call failed. The report is delivered; the files that part held are listed under Not audited. Dispatch the audit again to cover them (every part runs again)."
          exit 1
