# review-bot-template: jimwclement/builder-ops .github/scripts/review-bot/code-review.yml
#
# Code review bot, SHARED TEMPLATE copy. Do not edit this file in the repo it
# was installed into: edit it in jimwclement/builder-ops
# (.github/scripts/review-bot/) and re-run `scripts/add-review-bot.sh
# <owner/repo>` there. `scripts/review-bot-status.sh` reports a copy that
# no longer matches, and the daily "Review bot coverage" workflow in
# builder-ops opens the update PR for it. The marker on the first line is
# how those scripts tell a template copy from a repo's own hand-built bot.
# Its sibling, .github/workflows/code-audit.yml, audits the whole repo on
# demand with the same review.mjs.
#
# What it does, per pull request push (drafts never; the "review" label
# re-runs it; any other label does nothing and cancels nothing):
#   1. classifies the changed files by risk (.github/scripts/classify-change.mjs),
#   2. sends the diff and the house rules (AGENTS.md, else CLAUDE.md) to ONE
#      OpenAI model in ONE request (.github/scripts/review.mjs, the same file
#      builder-ops runs): gpt-6.1-sol, medium reasoning for tier 3, low
#      for tiers 1 and 2,
#   3. commits the report to docs/reviews/pr-<number>.md on the PR branch,
#   4. sets the commit status "Code review verdict" on the reviewed commit
#      and on the report commit: success for "Safe to merge" and "Needs
#      fixes" (with a warning), failure for "Blocked". The job itself goes
#      red on "Blocked", after the report is committed.
# It needs one repository secret, OPENAI_API_KEY. Without it the job stops
# with "OPENAI_API_KEY is not set on this repo" right after the trusted
# checkout and the classifier: no PR checkout, no model call, no commit. A
# review that did not run is red, never green. (A change of inert assets
# only is skipped before that check, and is green with or without a key.)
#
# ONE JOB, deliberately (13 Oct 2026). The bot this came from splits this into
# route, review and commit jobs. GitHub bills every job rounded UP to the
# minute, so that layout costs 3 billed minutes for about 40 seconds of work,
# against the account's included Actions minutes. The split kept the write
# token out of the job that holds the provider key and reads PR content. This job keeps the property that
# split protected, that NOTHING FROM THE PULL REQUEST EVER RUNS, by layout
# rather than by job boundary:
#   - pull_request_target: this workflow, the classifier, the review script
#     and the house rules all come from the DEFAULT branch (trusted/). A PR
#     cannot edit the code that reviews it; changes take effect after merge.
#   - The PR is checked out by immutable head SHA into pr/, a sibling of
#     trusted/, with no persisted credentials. It is only ever read: git
#     diff, and the previous report through review.mjs's regular-file check.
#     No npm install, no build, no script, no action from the PR.
#   - Each secret reaches only the step that needs it: the OpenAI key the key
#     check and the review step; the job token the classifier (read), the
#     report push and the status calls.
#   - The report push is a plain fast-forward of the exact reviewed SHA, only
#     for same-repository branches, never to the default branch.
# If that ever stops being true (a step that runs PR code), split the write
# steps back into their own job.
#
# The report commit carries the skip-CI marker, so a
# squash merge must pass an explicit --body (the marker would otherwise land
# in main's commit message and skip CI there).
name: Code review

# No paths-ignore (13 Oct 2026). A directory-wide "docs/reviews/**" filter
# also skipped executable files placed there. The report commit cannot start
# a review anyway: it is pushed with the job token, and GitHub starts no
# workflow for a push made with GITHUB_TOKEN; the github-actions[bot] actor
# check below is the second stop. A PR of report files only is classified
# tier 0 and skipped without a model call.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# One review per PR at a time: a new push cancels the review of the old head.
# A label other than "review" gets a group of its own, unique to its run, so
# it never cancels a review (15 Oct 2026). Until then every event shared one
# group, and workflow-level concurrency acts on the whole run, before the
# job's `if` can skip it. A tool that opens its PR and adds a label a second
# later (as the site's pin runner does with "pin-runner") made the label's run
# take the group, cancel the review that "opened" had started and then be
# skipped by the `if`, so two PRs got no review at all (one cancelled and one
# skipped run each). GitHub's docs do not say whether a job skipped by its
# `if` still joins a JOB-level group, so the group name carries the decision
# instead. Keep its label test in step with the job's `if`: a labeled event
# the job would skip must never land in the review group.
concurrency:
  group: code-review-${{ github.event.pull_request.number }}${{ (github.event.action == 'labeled' && github.event.label.name != 'review') && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: review
    if: >
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    # review.mjs aborts its one model call after 6 minutes.
    timeout-minutes: 12
    permissions:
      contents: write # the report commit on the PR branch
      pull-requests: read # the classifier's changed-file list
      statuses: write # the "Code review verdict" status
    steps:
      - name: Trusted scripts and house rules from the DEFAULT branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          # review.mjs imports classify-change.mjs: anything it imports has to
          # be listed here too (ERR_MODULE_NOT_FOUND in the bot this came
          # from, 8 Sep 2026). A rules file that does not exist is simply
          # absent.
          sparse-checkout: |
            .github/scripts/review.mjs
            .github/scripts/classify-change.mjs
            AGENTS.md
            CLAUDE.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Classify changed files
        id: classify
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! -f .github/scripts/classify-change.mjs ]]; then
            echo "::warning::No trusted classifier on the default branch. Failing open at tier 3."
            {
              echo "skip=false"; echo "tier=3"; echo "provider=openai"
              echo "model=gpt-6.1-sol"; echo "effort=medium"; echo "files=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .github/scripts/classify-change.mjs

      - name: Nothing to review
        if: steps.classify.outputs.skip == 'true'
        run: echo "::notice title=No review::Only inert assets or generated files changed, so no model was called."

      - name: Check the OpenAI key is set
        if: steps.classify.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::error title=OPENAI_API_KEY is not set on this repo::No review ran. The daily Review bot coverage run in jimwclement/builder-ops sets the repository secret OPENAI_API_KEY; by hand, from a builder-ops checkout with the key on the clipboard: scripts/set-review-key.sh ${GITHUB_REPOSITORY}. Then re-run this job or push again."
            exit 1
          fi

      - name: Checkout PR head by immutable SHA (data only, no persisted creds)
        if: steps.classify.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          # Full history, for the merge base of base...head. Small site
          # repos clone in seconds.
          fetch-depth: 0
          persist-credentials: false

      - name: Find this PR's previous report (no secrets in this step)
        # Its "## Claude Fix Notes" go to the reviewer as claims to verify.
        # One fixed path or none comes out of here, never PR-controlled text.
        if: steps.classify.outputs.skip != 'true'
        id: previous
        working-directory: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected PR number."; exit 1; }
          PREVIOUS=""
          if [[ -f "docs/reviews/pr-${PR_NUMBER}.md" ]]; then PREVIOUS="docs/reviews/pr-${PR_NUMBER}.md"; fi
          echo "Previous report: ${PREVIOUS:-none}"
          echo "path=${PREVIOUS}" >> "$GITHUB_OUTPUT"

      - name: Review the diff (one API call)
        if: steps.classify.outputs.skip != 'true'
        working-directory: pr
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OpenAI only: review.mjs refuses any Gemini route when this is set.
          REVIEW_NO_GOOGLE: "1"
          REVIEW_MODE: pr
          REVIEW_TIER: ${{ steps.classify.outputs.tier }}
          REVIEW_PROVIDER: ${{ steps.classify.outputs.provider }}
          REVIEW_MODEL: ${{ steps.classify.outputs.model }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha }}
          TIER_NOTE: "Tier 3 means it touches server code (route handlers, server actions, middleware, lib/, scripts/), production config, dependencies, public input or the CI workflows themselves."
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Outside the PR checkout; the commit step puts it on the branch.
          OUTPUT_FILE: ${{ runner.temp }}/code-review.md
          # The PR's own previous report (step above). review.mjs passes its
          # Claude Fix Notes as author CLAIMS to verify, and refuses anything
          # that is not a regular file.
          PREVIOUS_REVIEW: ${{ steps.previous.outputs.path }}
        run: |
          # Never the PR's copy: that would run PR-controlled code with the
          # provider key in its environment. Bootstrap: the installer's PR
          # lands review.mjs on the default branch; the first review runs on
          # the PR after it.
          SCRIPT=../trusted/.github/scripts/review.mjs
          if [[ ! -f "$SCRIPT" ]]; then
            echo "::error::No trusted review script on the default branch. Refusing to run the PR's copy with the provider key."
            exit 1
          fi
          # House rules from the trusted checkout: AGENTS.md, else CLAUDE.md.
          RULES_FILE=../trusted/AGENTS.md
          if [[ ! -f "$RULES_FILE" && -f ../trusted/CLAUDE.md ]]; then RULES_FILE=../trusted/CLAUDE.md; fi
          export RULES_FILE
          node "$SCRIPT"

      - name: Read the verdict
        if: steps.classify.outputs.skip != 'true'
        id: verdict
        run: |
          REPORT="${RUNNER_TEMP}/code-review.md"
          # review.mjs has already validated the report: the first non-empty
          # line under "## Verdict" is one of three fixed values. Checked
          # again here because it becomes a step output and a status.
          VERDICT=$(awk '/^## Verdict[[:space:]]*$/ {f=1; next} f && NF {sub(/[[:space:]]+$/, ""); print; exit}' "$REPORT")
          case "$VERDICT" in
            "Safe to merge"|"Needs fixes"|"Blocked") ;;
            *) echo "::error::The report has no valid verdict line."; exit 1 ;;
          esac
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          echo "Verdict: ${VERDICT}"

      - name: Commit the report to docs/reviews/pr-<number>.md on the PR branch
        # Same-repository branches only: a fork's branch name could resolve
        # to a base-repo branch of the same name and the push would land there.
        if: >
          steps.classify.outputs.skip != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        id: push
        working-directory: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Unexpected PR number."; exit 1; }
          # A PR whose head IS the default branch would put the report on
          # production. Never.
          if [[ "$HEAD_REF" == "$DEFAULT_BRANCH" ]]; then
            echo "::error::The PR head is the default branch (${DEFAULT_BRANCH}). Not committing the report there; it is in this run's log only."
            exit 1
          fi
          # A push that landed while the model was running would otherwise get
          # the previous commit's report. cancel-in-progress catches most of
          # these; this catches the rest. The new head has its own run.
          CURRENT=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          if [[ "$CURRENT" != "$HEAD_SHA" ]]; then
            echo "::warning::PR head moved to ${CURRENT} while ${HEAD_SHA} was being reviewed. Not committing this report; the new head has its own run."
            exit 1
          fi
          # The branch is PR content: never write through a symlink it planted.
          for d in docs docs/reviews; do
            if [[ -L "$d" ]]; then echo "::error::${d} is a symlink on this branch. Not writing the report."; exit 1; fi
          done
          REVIEW_PATH="docs/reviews/pr-${PR_NUMBER}.md"
          mkdir -p docs/reviews
          rm -f "$REVIEW_PATH"
          cp "${RUNNER_TEMP}/code-review.md" "$REVIEW_PATH"
          # What only the workflow knows, so it cannot be hallucinated.
          echo "sha: ${HEAD_SHA} | run: ${GITHUB_RUN_ID} | at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REVIEW_PATH"
          git add -- "$REVIEW_PATH"
          if git diff --cached --quiet; then
            echo "No change to ${REVIEW_PATH}. Skipping commit."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Code review [skip ci]"
            # The job token reaches git through the environment, never
            # .git/config. A plain push: it fails rather than overwrite if the
            # branch moved after the check above.
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git push --quiet origin "HEAD:refs/heads/${HEAD_REF}"
            echo "Committed ${REVIEW_PATH} to ${HEAD_REF}."
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Keep a fork's report as an artifact
        if: >
          steps.classify.outputs.skip != 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-review
          path: ${{ runner.temp }}/code-review.md
          if-no-files-found: error

      - name: Put the verdict on the PR head as a commit status
        # On the reviewed commit, which carries the CI runs, and on the report
        # commit the PR head now points at, which no workflow runs on. The
        # coordinator reads it with:
        #   gh api repos/<owner>/<repo>/commits/<sha>/statuses --jq '.[] | select(.context=="Code review verdict")'
        if: steps.classify.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          NEW_HEAD: ${{ steps.push.outputs.head }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$VERDICT" == "Blocked" ]]; then STATE=failure; else STATE=success; fi
          DESC="${VERDICT}: docs/reviews/pr-${PR_NUMBER}.md"
          for SHA in $(printf '%s\n' "$REVIEWED_SHA" "$NEW_HEAD" | grep -E '^[0-9a-f]{40}$' | sort -u); do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              -f state="$STATE" -f context="Code review verdict" -f description="$DESC" -f target_url="$RUN_URL" > /dev/null
            echo "Code review verdict: ${STATE} (${VERDICT}) on ${SHA}"
          done
          echo "Verdict: **${VERDICT}** (docs/reviews/pr-${PR_NUMBER}.md)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the check on a Blocked verdict
        # After the commit, so the report that explains the red is already on
        # the branch. A new push is reviewed afresh and decides again.
        if: steps.verdict.outputs.verdict == 'Blocked'
        run: |
          echo "::error title=Review verdict - Blocked::docs/reviews/pr-${{ github.event.pull_request.number }}.md on this branch says Blocked. Read its Critical Issues, fix them (or answer them under Claude Fix Notes), and push; the next review decides again."
          exit 1

      - name: Flag a Needs fixes verdict
        if: steps.verdict.outputs.verdict == 'Needs fixes'
        run: echo "::warning title=Review verdict - Needs fixes::Read docs/reviews/pr-${{ github.event.pull_request.number }}.md on this branch before merging."
